name: Blacksmith Build

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    sqlx:
        name: SQLx Build
        runs-on: blacksmith-2vcpu-ubuntu-2404
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: oxidechat
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d oxidechat"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/oxidechat
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
              with:
                  toolchain: stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Install SQLx CLI
              run: cargo install sqlx-cli --no-default-features --features postgres --locked

            - name: Run migrations
              run: cargo sqlx migrate run

            - name: Regenerate SQLx metadata
              run: cargo sqlx prepare

            - name: Upload SQLx metadata
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sqlx-metadata
                  path: .sqlx/
                  include-hidden-files: true
                  if-no-files-found: error

    init:
        name: Init Build Metadata
        runs-on: blacksmith-2vcpu-ubuntu-2404
        outputs:
            image_name: ${{ steps.vars.outputs.image_name }}
            tag: ${{ steps.vars.outputs.tag }}
            is_latest: ${{ steps.vars.outputs.is_latest }}
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Extract version and tag
              id: vars
              run: |
                  # Lowercase the owner name for Docker registry compatibility
                  OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  IMAGE_NAME=ghcr.io/${OWNER_LC}/oxidechat

                  IS_LATEST=true
                  if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      TAG="${GITHUB_REF_NAME#v}"
                      if [[ "$TAG" == *-* ]]; then
                          IS_LATEST=false
                      fi
                  else
                      # Extract version from Cargo.toml
                      VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
                      [ -z "$VERSION" ] && VERSION="0.0.0"

                      TIMESTAMP=$(date +%Y%m%d-%H%M)
                      TAG="${VERSION}-${TIMESTAMP}"
                  fi

                  echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
                  echo "📦 Image: $IMAGE_NAME"
                  echo "🏷️  Tag: $TAG"
                  echo "📌 Latest: $IS_LATEST"

    build:
        needs: [init, sqlx]
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: blacksmith-2vcpu-ubuntu-2404
                      suffix: amd64
                    - platform: linux/arm64
                      runner: blacksmith-2vcpu-ubuntu-2404-arm
                      suffix: arm64

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Download SQLx metadata
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: sqlx-metadata
                  path: .sqlx/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Log in to Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: ${{ github.event_name != 'pull_request' }}
                  cache-from: type=gha,scope=${{ matrix.suffix }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
                  provenance: false
                  outputs: type=image,name=${{ needs.init.outputs.image_name }},push-by-digest=${{ github.event_name != 'pull_request' }},name-canonical=true

            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: digests-${{ matrix.suffix }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # ============================================================================
    # Docker - Create multi-arch manifest after parallel builds complete
    # ============================================================================
    docker:
        needs: [init, build]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        if: github.event_name != 'pull_request'

        permissions:
            contents: read
            packages: write
            id-token: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Log in to Container Registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create manifest list and push
              env:
                  IMAGE_NAME: ${{ needs.init.outputs.image_name }}
                  TAG: ${{ needs.init.outputs.tag }}
                  IS_LATEST: ${{ needs.init.outputs.is_latest }}
              working-directory: /tmp/digests
              run: |
                  TAGS=(-t "$IMAGE_NAME:$TAG")
                  if [ "$IS_LATEST" = "true" ]; then
                      TAGS+=(-t "$IMAGE_NAME:latest")
                  fi

                  docker buildx imagetools create \
                    "${TAGS[@]}" \
                    $(printf "$IMAGE_NAME@sha256:%s " *)

                  echo "✅ Pushed ${TAGS[*]}"

            - name: Inspect image
              env:
                  IMAGE_NAME: ${{ needs.init.outputs.image_name }}
                  TAG: ${{ needs.init.outputs.tag }}
              run: |
                  docker buildx imagetools inspect $IMAGE_NAME:$TAG

            - name: Install cosign
              uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

            - name: Sign image (keyless cosign via GitHub OIDC)
              env:
                  IMAGE_NAME: ${{ needs.init.outputs.image_name }}
                  TAG: ${{ needs.init.outputs.tag }}
              run: |
                  DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:$TAG" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)
                  echo "Signing $IMAGE_NAME@sha256:$DIGEST"
                  cosign sign --yes "$IMAGE_NAME@sha256:$DIGEST"
