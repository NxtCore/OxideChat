name: Tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Clippy and Tests
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: oxidechat
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d oxidechat"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/oxidechat
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
              with:
                  toolchain: stable
                  components: clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Install SQLx CLI
              run: cargo install sqlx-cli --no-default-features --features postgres --locked

            - name: Run migrations
              run: sqlx migrate run

            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Test
              run: cargo test

            - name: Generated frontend types are current
              run: git diff --exit-code frontend/types/generated
