[package]
name = "OxideChat"
version = "0.4.1"
edition = "2024"
description = "A modern, performance and on customization focused AI chat application"
license = "Apache-2.0"
repository = "https://github.com/NxtCore/OxideChat"
readme = "README.md"
keywords = ["chat", "axum", "websocket", "postgres"]
categories = ["web-programming"]

[dependencies]
axum = { version = "0.8.9" }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [
    "postgres",
    "chrono",
    "tls-native-tls",
    "runtime-tokio",
    "macros",
    "migrate",
    "uuid",
    "rust_decimal",
] }
dotenv = { version = "0.15" }
argon2 = { version = "0.6" }
uuid = { version = "1.29", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tower-cookies = { version = "0.11" }
arc-swap = "1.9.5"
oauth2 = { version = "5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "multipart",
    "stream",
] }
tower-http = { version = "0.7", features = ["cors"] }
omniference = { version = "0.7.1" }
aes-gcm = "0.11"
rand = "0.10"
rust_decimal = { version = "1.43.0", features = ["db-postgres", "serde"] }
futures-util = "0.3.34"
http-body = "1"
async-stream = "0.3.6"
tokio-util = "0.7.20"
extism = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
base64 = "0.23"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
infer = "0.22"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
must_use_candidate = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
inconsistent_struct_constructor = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
cargo = { level = "warn", priority = -1 }
future_not_send = "warn"
fallible_impl_from = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
multiple_crate_versions = "allow"
too_many_lines = "warn"
cognitive_complexity = "warn"

[lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl", "serde-json-impl", "no-serde-warnings"] }
