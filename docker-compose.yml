services:
  oxidechat:
    image: ghcr.io/nxtcore/oxidechat:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    # Reachable only from this host; your TLS proxy forwards to it. Publishing "8080:8080" exposes plain HTTP to the network.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - oxidechat-data:/app/data
      - oxidechat-uploads:/app/uploads

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  oxidechat-data:
  oxidechat-uploads:
  postgres-data:
